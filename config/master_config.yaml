# =============================================================================
# PROJECT APEX — MASTER CONFIGURATION
# =============================================================================
# Single-source YAML holding every hyperparameter from Bible §0.2, plus
# architectural, pipeline, and evaluation parameters from §2–§10.
# Validated on load (types, ranges). [UNRESOLVED] flags are explicit placeholders.
# =============================================================================

# =============================================================================
# §8  SAC TRAINING
# =============================================================================

sac:
  # §8.8  Temperature (Alpha)
  init_alpha: 0.2                    # Initial temperature; log_alpha initialized accordingly
  alpha_min: 0.0001                  # Lower bound on alpha; prevents entropy collapse
  alpha_max: 1.0                     # Upper bound on alpha; prevents excessive randomness
  alpha_lr: 0.0001                   # Adam LR for log_alpha
  alpha_weight_decay: 0.0            # No weight decay on alpha
  entropy_scale_factor: 1.0          # H_target = -ln(K_active) * scale_factor
  alpha_clamp_min: -9.2103           # log(1e-4) — lower clamp on log_alpha
  alpha_clamp_max: 0.0               # log(1.0)  — upper clamp on log_alpha

  # §8.1  Discount
  gamma: 0.975                       # Discount factor; valid range (0, 1)

  # §8.2  N-Step Returns
  n_step: 4                          # Multi-step return horizon (weeks); ≥ 1

  # §8.7  Update Schedule
  updates_per_step: 20               # Gradient updates per env step
  policy_delay: 2                    # Actor/alpha updated every N critic updates; ≥ 1
  batch_size: 32                     # Transitions sampled per update
  grad_accum_steps: 1                # No gradient accumulation
  mixed_precision: false             # Full float32; no fp16/bf16
  distributed_training: false        # Single-GPU training only

  # §8.10  Target Networks (Polyak Averaging)
  tau: 0.01                          # Polyak rate; valid (0, 0.1]; increased for faster target updates

  # §8.11  Gradient Clipping
  grad_clip_critic: 0.5              # Critic max grad norm; valid (0, 2]; reduced for stability
  grad_clip_encoder: 1.0             # Encoder max grad norm; valid (0, 2]; excludes embeddings
  grad_clip_actor: 5.0               # Actor max grad norm; valid (0, ∞); looser by design
  # log_alpha: no clipping (scalar)

  # §8.11  Bellman Target Clipping
  bellman_clip_low:  -30.0           # Floor for z_target clamp; prevents Q-value divergence on crash data
  bellman_clip_high:  35.0           # Ceiling for z_target clamp (reward ±5 × n_step=4 → R_n max ≈ ±19); raised 30→35 for headroom in stable folds

# =============================================================================
# §8.3–8.6  REPLAY BUFFER
# =============================================================================

replay:
  # §8.3  Capacity and Sampling
  capacity: 800                      # 3 episodes × ~267 transitions per 5-year window
  recency_half_life_years: 3         # Exponential recency half-life (calendar time)

  # §8.6  Warmup
  warmup_steps: 52                   # ~1 year of random-but-feasible portfolios
  warmup_exclusion_threshold: 128    # Exclude warmup from sampling after this many policy transitions

  # §8.4  Transition Augmentation (critic path only)
  aug_reward_noise_factor: 0.01      # r_aug = r + N(0, (factor × buffer_reward_std)²)
  aug_obs_noise_factor: 0.015        # x_aug[f] = x + N(0, (factor × per_feature_std[f])²)

# =============================================================================
# §8.9  OPTIMIZER CONFIGURATION
# =============================================================================

optimizer:
  # Critic (Q1, Q2)
  critic_optimizer: "adam"
  critic_lr: 0.00005
  critic_weight_decay: 0.0

  # Actor
  actor_optimizer: "adam"
  actor_lr: 0.0001
  actor_weight_decay: 0.0

  # Encoder (TCN + Attention) — embedding params use separate group with wd=0.0
  encoder_optimizer: "adamw"
  encoder_lr: 0.0003
  encoder_weight_decay: 0.0001       # NOT applied to TickerEmbedding / SectorEmbedding

  # Temperature (log_alpha)
  alpha_optimizer: "adam"
  # alpha_lr lives in sac section; alpha_weight_decay = 0.0

# =============================================================================
# §4, §7  MODEL ARCHITECTURE
# =============================================================================

architecture:
  # §4.1  Observation Space Dimensions  (§0.2 table)
  K_max: 110                       # Max padded asset dimension; ≥ max historical NDX size
  L: 60                              # Observation lookback window in weeks
  F: 25                              # Per-asset features per time step (17 TS + 8 CS)

  # §7.4  TCN Encoder
  tcn_levels: 5                      # Dilated conv layers; receptive field ≥ L
  tcn_kernel_size: 3                 # Kernel size k
  tcn_channels: 128                  # Channels per layer
  tcn_dilation_base: 2               # d_l = dilation_base^l
  tcn_activation: "silu"             # SiLU (Sigmoid Linear Unit)
  tcn_normalization: "layernorm"     # Applied within residual blocks
  tcn_dropout: 0.05                  # Dropout rate
  tcn_use_residual: true             # Enable residual connections

  # §7.5  Cross-Asset Attention
  attn_num_heads: 4                  # Each head gets d_model / num_heads
  attn_d_model: 128                  # Total attention dimension
  attn_d_ff: 256                     # Feed-forward sublayer dimension
  attn_dropout: 0.05                 # Dropout on attention weights
  attn_num_layers: 2                 # Stacked transformer-style blocks
  attn_padding_mask: true            # mask_t[i]=0 slots get -∞ before softmax
  attn_sector_adjacency_bias: true   # Additive bias for same-GICS-sector pairs

  # §7.3  Embeddings
  ticker_emb_dim: 32                 # Learnable nn.Embedding keyed by security_id
  sector_emb_dim: 8                  # Learnable nn.Embedding keyed by GICS sector_code
  num_sectors: 12                    # Vocab size = 11 GICS sectors + 1 unknown slot (GICS_TO_IDX)

  # §7.6  Actor Head MLP
  actor_hidden_dims: [64, 64]        # SiLU activations (reduced from [128, 128] for RTX 3070)
  log_sigma_init: -1.5               # Initial log-std of action noise (σ ≈ 0.22); §4.4
  log_sigma_min: -5.0                # Clamp floor — prevents fully deterministic policy; §4.4
  log_sigma_max: 1.0                 # Clamp ceiling — caps maximum exploration noise; §4.4

  # §7.8  Critic Head MLP (twin Q1, Q2)
  critic_hidden_dims: [128, 128]     # SiLU activations (reduced from [256, 256] for RTX 3070)
  n_quantiles: 32                    # Distributional (quantile regression) critic

# =============================================================================
# §6  REWARD FUNCTION
# =============================================================================

reward:
  # §6  Penalty Weights
  lambda_slow: 0.50                  # Slow vol penalty; tuning range [0.5, 1.25] — reduced from 0.75 to reduce bull-market over-conservatism
  lambda_tail: 0.4                   # Quadratic downside penalty; tuning range [0.3, 0.5]
  lambda_cost: 1.0                   # Explicit transaction cost penalty; ≥ 0
  lambda_cv: 1.0                     # Soft constraint violation penalty; ≥ 0

  # Tuning guidance ranges (from §6 reward-shaping table)
  lambda_slow_range: [0.5, 1.25]
  lambda_tail_range: [0.3, 0.5]

  # §6  Rolling Volatility Windows
  sigma_mkt_window_weeks: 13         # σ_mkt,t — QQQ realized vol causal window
  sigma_port_window_weeks: 52        # σ_t — portfolio return vol causal window

# =============================================================================
# §5.4  TRANSACTION COST MODEL  (all marked "fixed" in §0.2)
# =============================================================================

transaction_costs:
  # Commission
  commission_bps: 1.0                # Flat commission in basis points

  # Spread component
  spread_coeff: 2.0
  spread_adv_exp: 0.3                # ADV exponent
  spread_vol_floor: 0.20             # Vol normalization floor

  # Market-impact component
  impact_coeff: 10.0
  impact_size_exp: 0.5               # Square-root participation rate

  # Gap-risk component
  gap_coeff: 1.5
  gap_scaling: 0.7979                # √(2/π) constant

# =============================================================================
# §4.5  PORTFOLIO CONSTRAINTS
# =============================================================================

constraints:
  per_name_cap: 0.20                 # Max weight per asset; valid (0, 1)
  sector_cap: 0.50                   # Max weight per GICS sector; valid (0, 1)

# =============================================================================
# §3  FEATURE ENGINEERING
# =============================================================================

features:
  # §3.6  Normalization Strategy
  norm_window_weeks: 52              # Rolling z-score window (training-fold stats)
  norm_clip_threshold: 4.0           # Clip normalized features to ±threshold

  # §3.1.1  Per-Asset Time-Series Features  (F_ts = 17)
  per_asset_ts_features:
    - open
    - close
    - volume
    - log_ret
    - ret_1w
    - ret_4w
    - ret_13w
    - vol_1w
    - vol_4w
    - vol_52w
    - volume_z_4w
    - beta_26w_mkt
    - rel_strength_4w
    - vol_ratio_1w_4w
    - RSI_14
    - bollinger_percent_b
    - bollinger_bandwidth

  # §3.2.1  Cross-Sectional Features  (F_cs = 8)
  cross_sectional_features:
    - ret_rank_4w
    - ret_z_4w
    - ret_z_13w
    - vol_z_4w
    - volume_z_cs_4w
    - ret_z_4w_sector
    - vol_z_4w_sector
    - momentum_sector_residual

  # §3.3.1  Macro / Broadcast Instruments
  macro_instruments:
    - { name: "QQQ",          symbol: "QQQ",       purpose: "Benchmark regime" }
    - { name: "VIX",          symbol: "^VIX",      purpose: "Equity volatility regime" }
    - { name: "10Y Yield",    symbol: "^TNX",      purpose: "Discount rate" }
    - { name: "3M Yield",     symbol: "^IRX",      purpose: "Short rate" }
    - { name: "Yield Spread", symbol: "^TNX-^IRX",  purpose: "Cycle phase" }
    - { name: "Oil",          symbol: "CL=F",      purpose: "Inflation shock" }
    - { name: "Gold",         symbol: "GC=F",      purpose: "Monetary stress" }
    - { name: "Dollar Index", symbol: "DX-Y.NYB",  purpose: "Liquidity regime" }
    - { name: "High Yield ETF", symbol: "HYG",     purpose: "Credit stress" }

  # §3.4.1  Portfolio-State Features  (included in g_t)
  portfolio_state_features:
    - { name: "Turnover Last Step",              window: "1 step",    normalization: "global z-score" }
    - { name: "Realized Portfolio Volatility",   window: "13 weeks",  normalization: "global z-score" }
    - { name: "Current Drawdown",                window: "episode",   normalization: "scaled [-1, 0]" }
    - { name: "Gross Exposure",                  window: "1 step",    normalization: "none (≈1.0)" }
    - { name: "Rolling Excess Return vs QQQ",    window: "13 weeks",  normalization: "global z-score" }
    - { name: "Estimated Cost Next Step",        window: "1 step",    normalization: "global z-score" }
    - { name: "Effective # of Positions",        window: "1 step",    normalization: "global z-score" }
    - { name: "Market Volatility Regime",        window: "52 weeks",  normalization: "global z-score" }

  # §3.5.1  Benchmark Features  (included in g_t)
  benchmark_features:
    - { name: "QQQ 1-Week Return",      window_days: 5,  computed_from: "log return adj close" }
    - { name: "QQQ 4-Week Volatility",  window_days: 20, computed_from: "std daily log ret × √252" }
    - { name: "QQQ 12-Week Return",     window_days: 60, computed_from: "log return adj close" }

# =============================================================================
# §9  EVALUATION FRAMEWORK
# =============================================================================

evaluation:
  # §9.1  Walk-Forward Design
  n_folds: 8                         # Expanding-window walk-forward folds
  embargo_weeks: 4                   # Must equal n_step (prevents n-step leakage)

  # §9.5  Confidence Intervals (Block Bootstrap)
  bootstrap_resamples: 10000
  ci_level: 0.95

  # §9.4  Baselines
  equal_weight_threshold: 0.01       # ε for defining "model picks" in Equal Weight baseline

  # §9.1  Fold Definitions
  folds:
    - { fold: 1, train_start: "2005-01-01", train_end: "2009-12-31", test_start: "2010-01-01", test_end: "2011-12-31" }
    - { fold: 2, train_start: "2006-01-01", train_end: "2011-12-31", test_start: "2012-01-01", test_end: "2013-12-31" }
    - { fold: 3, train_start: "2008-01-01", train_end: "2013-12-31", test_start: "2014-01-01", test_end: "2015-12-31" }
    - { fold: 4, train_start: "2010-01-01", train_end: "2015-12-31", test_start: "2016-01-01", test_end: "2017-12-31" }
    - { fold: 5, train_start: "2012-01-01", train_end: "2017-12-31", test_start: "2018-01-01", test_end: "2019-12-31" }
    - { fold: 6, train_start: "2014-01-01", train_end: "2019-12-31", test_start: "2020-01-01", test_end: "2021-12-31" }
    - { fold: 7, train_start: "2016-01-01", train_end: "2021-12-31", test_start: "2022-01-01", test_end: "2023-12-31" }
    - { fold: 8, train_start: "2018-01-01", train_end: "2023-12-31", test_start: "2024-01-01", test_end: "present" }

  # §1.2  Success Criteria
  success_criteria:
    primary:
      - { metric: "OOS Excess CAGR — 95% CI lower bound", threshold: "strictly > 0%" }
      - { metric: "OOS Excess CAGR (point estimate)",      threshold: "materially positive vs QQQ" }
      - { metric: "OOS Sortino Ratio",                     threshold: "exceeds QQQ Sortino" }
      - { metric: "OOS Max Drawdown",                      threshold: "≤ QQQ drawdown" }
    secondary:
      - { metric: "OOS Sharpe Ratio",                      threshold: "> QQQ Sharpe" }
      - { metric: "Effective N Positions",                 threshold: "not degenerate concentration" }
      - { metric: "Cost Drag",                             threshold: "costs must not eliminate alpha" }
    tertiary:
      - { metric: "OOS Skew / CVaR",                      threshold: "no extreme left-tail worsening vs QQQ" }
      - { metric: "Rank IC (w vs next-week return)",       threshold: "positive on average across folds" }

# =============================================================================
# §8.5  MULTI-EPISODE COLLECTION
# =============================================================================

collection:
  n_episodes_per_fold: 3             # Different exploration seeds per fold; sequential

# =============================================================================
# §10  LOGGING AND OBSERVABILITY
# =============================================================================

logging:
  update_cadence: 250                # Log categories 1-7 every N gradient updates

  # §10.7  Cadence Specification
  cadences:
    per_update: 250                  # Categories 1, 2, 3, 4, 6, 7  (§10.1)
    per_env_step: 1                  # Category 5 + all per-episode metrics  (§10.2)
    per_fold: 1                      # Full per-fold summary + required plots  (§10.3, §10.5)
    cross_fold: 1                    # Cross-fold summary + CI computation  (§10.4)

  # §10.6  Regression Alarms (Automatic Pass/Fail Flags)
  alarms:
    mask_leak:
      condition: "Any inactive slot has w_exec > 0"
      severity: "CRITICAL"
    q_divergence:
      threshold: 100
      condition: "|q1_mean| or |q2_mean| > threshold"
      severity: "HIGH"
    entropy_collapse:
      threshold: 0.01
      consecutive_steps: 100
      condition: "entropy_mean < threshold for > consecutive_steps"
      severity: "HIGH"
    alpha_pinned_max:
      consecutive_steps: 200
      condition: "alpha = alpha_max for > consecutive_steps"
      severity: "MEDIUM"
    nan_in_obs:
      condition: "nan_count_obs_active > 0"
      severity: "CRITICAL"
    constraint_violation:
      tolerance: 0.00001
      condition: "||w_exec||_1 ≠ 1.0 (tolerance) or any w_exec_i < 0"
      severity: "CRITICAL"
    warmup_contamination:
      condition: "Policy-generated update uses warmup transition after exclusion threshold"
      severity: "HIGH"

  # §8.12  Stability Diagnostics — Red-Flag Thresholds
  stability_diagnostics:
    q_divergence: "Diverging (unbounded growth)"
    q_gap_mean_threshold: 0.5
    entropy_degenerate: "→ 0 or → ln(K_active)"
    alpha_ceiling: "→ alpha_max = 1.0"
    grad_norm_actor_always_clipped: "Always == actor_clip (5.0)"
    td_error_plateaued: "Plateaued very high"
    projection_l1_dist_threshold: 0.3

# =============================================================================
# §4.1  OBSERVATION SPACE TENSOR SPECS
# =============================================================================

observation_space:
  x_t:   { shape: "[L, K_max, F]",  dtype: "float32", inactive_value: 0.0,  description: "Per-asset time-series features" }
  g_t:   { shape: "[D_global]",     dtype: "float32", inactive_value: null,  description: "Portfolio state + benchmark + macro" }
  mask_t: { shape: "[K_max]",       dtype: "float32", inactive_value: 0.0,  description: "1=tradeable, 0=inactive/padded" }
  active_ids_t: { shape: "[K_max]", dtype: "int64",   inactive_value: -1,   description: "security_id per slot; -1=inactive" }

# =============================================================================
# §2  DATA PIPELINE
# =============================================================================

data:
  data_dir: "Ticker_Data"
  daily_bars_file: "daily_bars.parquet"
  ndx_membership_file: "ndx_membership.parquet"
  macro_features_file: "macro_features.parquet"
  trading_calendar_file: "trading_calendar.parquet"
  ticker_alias_file: "ticker_alias.parquet"

  # §2.1.1  daily_bars schema
  daily_bars_schema:
    - { column: "date",        dtype: "datetime64" }
    - { column: "security_id", dtype: "int64" }
    - { column: "ticker",      dtype: "str" }
    - { column: "open",        dtype: "float64", description: "Adjusted open (split+div)" }
    - { column: "close",       dtype: "float64", description: "Adjusted close" }
    - { column: "volume",      dtype: "int64",   description: "Share volume (unadjusted OK)" }
    - { column: "adj_factor",  dtype: "float64", description: "Cumulative adjustment factor" }

  # §2.1.2  ndx_membership schema
  ndx_membership_schema:
    - { column: "date",        dtype: "datetime64" }
    - { column: "security_id", dtype: "int64" }
    - { column: "ticker",      dtype: "str" }
    - { column: "sector_code", dtype: "str",     description: "GICS sector code" }
    - { column: "weight",      dtype: "float64", description: "NDX index weight (informational)" }

# =============================================================================
# §5.7  MISSINGNESS HANDLING
# =============================================================================

missingness:
  missing_in_window_threshold: 2     # missing_L[i] ≥ 2 → forced liquidation
  consecutive_missing_threshold: 3   # streak_missing[i] ≥ 3 → forced liquidation
  temporal_window_days: 60           # Window for missing_L calculation

# =============================================================================
# §8.9  RANDOM SEED & DETERMINISM
# =============================================================================

random_seed:
  use_deterministic: true            # torch.use_deterministic_algorithms(True)
  base_seed: 42                      # All random seeds derived from this base

# =============================================================================
# §13  UNRESOLVED ITEMS
# =============================================================================

unresolved:
  lr_scheduler: null                 # "implement cosine annealing if performance peaks early" — §13.1
  D_global: null                     # Exact dimension TBD; = portfolio_state(8) + benchmark(3) + macro(varies)
  K_max_note: "Set to 110 to safely cover historical NDX peaks of 103-104 members with headroom"
  attn_num_layers_note: "Bible shows [2 — bracket may indicate unresolved"
  sigma_mkt_window_note: "Window length marked TBD in §6"
  sigma_port_window_note: "Window length marked TBD in §6"
  updates_per_step_note: "Range 25–35 if convergence is slow; default 20"

